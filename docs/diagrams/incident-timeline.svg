<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" viewBox="0 0 1400 390" role="img" aria-labelledby="title desc">
  <title id="title">Checkout Platform cross-service incident timeline</title>
  <desc id="desc">The payment API begins with a 0.2 percent 5xx rate, deploys version 1.8.2, then reports an inventory timeout. Inventory API p95 latency is 2250 milliseconds. Payment API 5xx rate rises to 8.4 percent, its p95 latency reaches 2400 milliseconds, and a payment request eventually fails after retries.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#68778a"/></marker>
    <style>
      .title{font:700 22px Arial,sans-serif;fill:#162b46}.time{font:700 14px Arial,sans-serif;fill:#253952}.kind{font:700 11px Arial,sans-serif;letter-spacing:.4px}.owner{font:italic 12px Arial,sans-serif;fill:#64748b}.body{font:13px Arial,sans-serif;fill:#34465e}.note{font:13px Arial,sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect width="1400" height="390" rx="18" fill="#f6f8fb"/>
  <text x="32" y="42" class="title">Checkout Platform · cross-service evidence (UTC)</text>
  <path d="M70 205 H1352" stroke="#68778a" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(24 94)"><rect width="176" height="222" rx="14" fill="#e8f1ff" stroke="#5b83bd" stroke-width="2"/><text x="12" y="27" class="time">12:03:00</text><text x="12" y="50" class="kind" fill="#426da8">METRIC · BASELINE</text><text x="12" y="72" class="owner">payment-api</text><text x="12" y="112" class="body"><tspan x="12" dy="0">http_5xx_rate</tspan><tspan x="12" dy="21">0.2 percent</tspan></text></g>
  <g transform="translate(220 94)"><rect width="176" height="222" rx="14" fill="#f0ebff" stroke="#8a70bf" stroke-width="2"/><text x="12" y="27" class="time">12:04:30</text><text x="12" y="50" class="kind" fill="#7256a5">DEPLOYMENT</text><text x="12" y="72" class="owner">payment-api</text><text x="12" y="112" class="body"><tspan x="12" dy="0">Version 1.8.2</tspan><tspan x="12" dy="21">production</tspan></text></g>
  <g transform="translate(416 94)"><rect width="176" height="222" rx="14" fill="#fff0ee" stroke="#d6786d" stroke-width="2"/><text x="12" y="27" class="time">12:05:00</text><text x="12" y="50" class="kind" fill="#b55248">ERROR LOG</text><text x="12" y="72" class="owner">payment-api</text><text x="12" y="112" class="body"><tspan x="12" dy="0">Upstream inventory</tspan><tspan x="12" dy="21">request timed out</tspan></text></g>
  <g transform="translate(612 94)"><rect width="176" height="222" rx="14" fill="#e8f1ff" stroke="#5b83bd" stroke-width="2"/><text x="12" y="27" class="time">12:05:05</text><text x="12" y="50" class="kind" fill="#426da8">METRIC</text><text x="12" y="72" class="owner">inventory-api</text><text x="12" y="112" class="body"><tspan x="12" dy="0">p95_latency</tspan><tspan x="12" dy="21">2250 ms</tspan></text></g>
  <g transform="translate(808 94)"><rect width="176" height="222" rx="14" fill="#e8f1ff" stroke="#5b83bd" stroke-width="2"/><text x="12" y="27" class="time">12:05:10</text><text x="12" y="50" class="kind" fill="#426da8">METRIC</text><text x="12" y="72" class="owner">payment-api</text><text x="12" y="112" class="body"><tspan x="12" dy="0">http_5xx_rate</tspan><tspan x="12" dy="21">rises to 8.4%</tspan></text></g>
  <g transform="translate(1004 94)"><rect width="176" height="222" rx="14" fill="#e8f1ff" stroke="#5b83bd" stroke-width="2"/><text x="12" y="27" class="time">12:05:20</text><text x="12" y="50" class="kind" fill="#426da8">METRIC</text><text x="12" y="72" class="owner">payment-api</text><text x="12" y="112" class="body"><tspan x="12" dy="0">p95_latency</tspan><tspan x="12" dy="21">2400 ms</tspan></text></g>
  <g transform="translate(1200 94)"><rect width="176" height="222" rx="14" fill="#fff0ee" stroke="#d6786d" stroke-width="2"/><text x="12" y="27" class="time">12:05:30</text><text x="12" y="50" class="kind" fill="#b55248">ERROR LOG</text><text x="12" y="72" class="owner">payment-api</text><text x="12" y="112" class="body"><tspan x="12" dy="0">Payment failed</tspan><tspan x="12" dy="21">after retry limit</tspan></text></g>
  <text x="32" y="356" class="note">Cross-service timing helps guide investigation; it does not prove the deployment or inventory service caused the incident.</text>
</svg>
